<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Profile Card</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href=" bootstrap-5.3.8-dist/css/bootstrap.min.css">
 
</head>
<body>
  <div class="card">
    <div class="avatar">AJ</div>
    <h1>Amara Johnson</h1>
    <p class="role">Frontend Developer</p>
    <p class="bio">I build things for the web.
    Coffee enthusiast. Lagos-based.</p>
    <a href="#" class="btn">View portfolio</a>
  </div>
  <table class="table table-secondary">
  <thead class="table-warning">
    <tr>
      <th scope="col">#</th>
      <th scope="col">First</th>
      <th scope="col">Last</th>
      <th scope="col">Handle</th>
    </tr>
  </thead>
  <tbody>
    <tr class="table-info">
      <th scope="row" class="table-warning">1</th>
      <td>Mark</td>
      <td>Otto</td>
      <td>@mdo</td>
    </tr>
    <tr>
      <th scope="row">2</th>
      <td>Jacob</td>
      <td>Thornton</td>
      <td>@fat</td>
    </tr>
    <tr>
      <th scope="row">3</th>
      <td>John</td>
      <td>Doe</td>
      <td>@social</td>
    </tr>
  </tbody>
</table>
</body>
</html>
