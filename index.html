<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="Decsription" content="Training, class, html training">
  <title>Bootstrap</title>
  <link rel="stylesheet" href="assets/bootstrap/css/bootstrap.min.css">
</head>
<body class="bg-danger">

  <div class="container">
    <form class="row g-3">
      <div class="col-12">
        <label for="name" class="form-label">Name:</label>
        <input type="text" id="name" class="form-control">
      </div>
      <div class="col-12">
        <label for="address" class="form-label">Address:</label>
        <input type="text" id="address" class="form-control">
      </div>
      <div class="col-12">
        <label for="email" class="form-label">Email:</label>
        <input type="email" class="form-control" id="email">
      </div>
      <div class="col-6">
        <label for="contact" class="form-label">Contact:</label>
        <input type="text" id="contact" class="form-control">
      </div>
      <div class="col-6">
        <label for="gender" class="form-label">Gender:</label>
        <select name="" id="gender" class="form-select">
          <option value="male">Male</option>
          <option value="female">Female</option>
        </select>
      </div>

      <div class="col-6">
        <label for="password" class="form-label">Password:</label>
        <input type="password" name="" id="password" class="form-control">
      </div>

      <div class="col-6">
        <label for="confirm-password" class="form-label">Confirm Password:</label>
        <input type="password" name="" id="confirm-password" class="form-control">
      </div>

      <div class="col-6"></div>
      <div class="col-6">
        <button type="button" class="btn btn-success w-100">Submit</button>
      </div>
    </form>

    <form class="g-2 pt-4">

      <div class="row">
        <label for="name" class="form-label col-1 col-form-label">Name:</label>
        <div class="col-11">
          <input type="text" name="" id="name" class="form-control">
        </div>
      </div>



    </form>
  </div>
  
  
  
  <script src="assets/bootstrap/js/bootstrap.bundle.min.js"></script>
</body>
</html>
